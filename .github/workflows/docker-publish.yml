name: publish-ghcr

# 为什么走 Actions 而不是本机脚本：
#   本机/NAS 到 registry-1.docker.io 的出口被掐，且现有 PAT 没有 packages 写权限。
#   GitHub 云端自带的 GITHUB_TOKEN 可以在本仓库内推 ghcr（permissions: packages: write），
#   既不依赖 NAS 出口，也不需要额外 PAT。
#
# 触发方式：
#   1) 仓库页 Actions → publish-ghcr → Run workflow（可填 tag，留空则用 2.2.9）
#   2) 推一个 v* tag（自动取 tag 名去掉 v 作为镜像 tag）

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像 tag（留空则用 Dockerfile 里的版本号）'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # 小写全名：ouooo/nexus

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 取源码
        uses: actions/checkout@v4

      - name: 解析版本与构建时间
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          DEFAULT_VERSION="$(sed -n 's/.*org.opencontainers.image.version="\([^"]*\)".*/\1/p' Dockerfile | head -n1)"
          if [ -n "${INPUT_TAG}" ]; then
            VERSION="${INPUT_TAG}"
          elif [ "${REF_TYPE}" = "tag" ]; then
            VERSION="${REF_NAME#v}"
          else
            VERSION="${DEFAULT_VERSION:-latest}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "镜像 tag = ${VERSION}"

      - name: 云端构建环境
        uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr（用仓库自带 GITHUB_TOKEN）
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            GIT_REVISION=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: 回显落库地址
        run: |
          echo "已推送：${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
          echo "包页面：https://github.com/users/${{ github.repository_owner }}/packages/container/package/nexus"
