name: publish-ghcr

# 触发方式：
#   1) 仓库页 Actions → publish-ghcr → Run workflow（可填 tag，留空则用 Dockerfile 里的版本号）
#   2) 推一个 v* tag（自动取 tag 名去掉 v 作为镜像 tag）
#
# 同时发两个库：
#   ghcr.io/<repo>：用仓库自带 GITHUB_TOKEN（packages: write），不依赖任何外部凭证；
#   bonanzalee/nexus-dashboard：用 secrets.DOCKERHUB_USER / DOCKERHUB_TOKEN，
#   没配 secret 时自动跳过，只推 ghcr。
#
# 为什么 Hub 那一份也要放在这里：群晖 Container Manager 的「注册表 → 搜索」只查
# Docker Hub（hub.docker.com/v2/search），而 ghcr 没有 v1/search（实测 404），
# 所以 ghcr 里的镜像在任何基于注册表搜索的 UI 里都搜不到，必须在 Hub 有同名仓库。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像 tag（留空则用 Dockerfile 里的版本号）'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  HUB_IMAGE: bonanzalee/nexus-dashboard

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 取源码
        uses: actions/checkout@v4

      - name: 解析版本与构建时间
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          DEFAULT_VERSION="$(sed -n 's/.*org.opencontainers.image.version="\([^"]*\)".*/\1/p' Dockerfile | head -n1)"
          if [ -n "${INPUT_TAG}" ]; then
            VERSION="${INPUT_TAG}"
          elif [ "${REF_TYPE}" = "tag" ]; then
            VERSION="${REF_NAME#v}"
          else
            VERSION="${DEFAULT_VERSION:-latest}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "镜像 tag = ${VERSION}"

      - name: 云端构建环境
        uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr（用仓库自带 GITHUB_TOKEN）
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录 Docker Hub（配了 secret 才执行）
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USER }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        if: ${{ env.HUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.HUB_USER }}
          password: ${{ env.HUB_TOKEN }}

      - name: 生成镜像 tag 列表
        id: tags
        env:
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -eu
          {
            echo "list<<TAGS_EOF"
            echo "${REGISTRY}/${IMAGE_NAME}:${VERSION}"
            echo "${REGISTRY}/${IMAGE_NAME}:latest"
            if [ -n "${HUB_TOKEN}" ]; then
              echo "${HUB_IMAGE}:${VERSION}"
              echo "${HUB_IMAGE}:latest"
            fi
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            GIT_REVISION=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

      - name: 回显落库地址
        run: |
          echo "ghcr: ${REGISTRY}/${IMAGE_NAME}:${{ steps.meta.outputs.version }}"
          echo "hub : ${HUB_IMAGE}:${{ steps.meta.outputs.version }}（未配 DOCKERHUB_* secret 时跳过）"
